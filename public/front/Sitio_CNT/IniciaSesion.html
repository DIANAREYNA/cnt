<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNT - Inicia sesión</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="overlay">
    <!-- MOBILE MODAL -->
    <div class="card mobile-card">
      <img src="img/cntbco_webpage.svg" alt="CNT" class="logo">

      <h2>Inicia sesión</h2>
      <p class="subtitle">Ir al check-out de las entradas</p>

      <input type="text" placeholder="Correo electrónico*" class="input">
      <input type="password" placeholder="Contraseña*" class="input">

      <a href="#" class="forgot">¿Has olvidado tu contraseña?</a>

      <button class="btn">Siguiente</button>

      <a href="#" class="create">Crear cuenta</a>
    </div>
  </div>

  <!-- DESKTOP WIDE LAYOUT -->
  <div class="desktop-container">
    <div class="desktop-card">
      <div class="left">
        <img src="img/cntbco_webpage.svg" alt="CNT" class="logo">
        <h2>Inicia sesión</h2>
        <p class="subtitle">Ir al check-out de las entradas</p>
      </div>

      <div class="right">
        <input type="text" placeholder="Correo electrónico*" class="input">
        <input type="password" placeholder="Contraseña*" class="input">

        <a href="#" class="forgot">¿Has olvidado tu contraseña?</a>
        <br>
        
        <div class="right-container">
        <a href="checkout.html" class="create">Crear cuenta</a>
        <a href="checkout.html" class="create"><button class="btn">Siguiente</button></a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
